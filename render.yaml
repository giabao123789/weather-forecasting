services:
  - type: web
    name: weather-api
    runtime: node
    plan: free
    buildCommand: cd api && npm install --include=dev && npm run build
    startCommand: cd api && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://weather-web-0m0x.onrender.com
        sync: false

  - type: web
    name: weather-web
    runtime: node
    plan: free
    buildCommand: cd web && npm install --include=dev && npm run build
    startCommand: cd web && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://weather-api-t8qf.onrender.com
