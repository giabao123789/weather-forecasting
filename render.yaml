services:
  - type: web
    name: weather-api
    runtime: node
    plan: free
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: weather-mongo
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: weather-web
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://weather-api.onrender.com

databases:
  - name: weather-mongo
    databaseName: weather-forecasting
    plan: free
